<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MORPHEUS · Development preview</title><link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="style.css"></head><body>
<header class="titlebar"><img class="logo" src="assets/logo-slot.svg" alt="Replaceable MORPHEUS logo slot"><span class="brand">MORPHEUS</span><span class="workspace-label">Personal workspace</span><div class="drag-region"></div><button id="sidebar-toggle" aria-label="Toggle conversation sidebar" aria-expanded="true" disabled></button><button id="notifications" aria-label="Notifications"></button><div class="window-controls" aria-label="Window controls are available in the Windows application"><button aria-label="Minimize (Windows only)" disabled>−</button><button aria-label="Maximize (Windows only)" disabled>□</button><button aria-label="Close (Windows only)" disabled>×</button></div></header>
<div class="workspace"><nav class="rail" aria-label="Main navigation"><div class="rail-top"><button data-page="home" aria-label="Home" aria-current="page"></button><button data-page="chat" aria-label="Chat"></button><button id="schedule" aria-label="Scheduled Tasks"></button><div class="menu-anchor"><button id="more" aria-label="More" aria-expanded="false" aria-controls="more-menu"></button><div id="more-menu" class="menu" hidden><button data-handoff="Usage">Usage</button><button data-handoff="Pair device">Pair device</button><button data-handoff="Connection event timeline">Connection event timeline</button></div></div></div><div class="rail-bottom"><span class="separator"></span><button id="connection" aria-label="Disconnected: no native Gateway connection in this preview"><span class="status disconnected"></span></button><button id="settings" aria-label="Settings"></button></div></nav>
<main id="home" aria-label="Home"></main>
<section id="chat" class="chat-layout" aria-label="Chat" hidden><aside class="conversations" aria-label="Conversations"><div class="sidebar-heading"><h1>Conversations</h1><button id="search-toggle" aria-label="Search conversations"></button><button id="new-chat" aria-label="New Chat"></button></div><input id="search" type="search" placeholder="Search conversations" aria-label="Search conversations" hidden><div id="session-list"></div><div class="session-empty"><span class="eyebrow">YOUR CONVERSATIONS</span><p id="session-note" class="quiet">Native sessions appear in the Windows app.</p></div></aside><div class="conversation-panel"><div id="empty-conversation" class="empty-conversation"><img src="assets/conversation-ring.svg" alt="" class="ring"><span class="eyebrow">MORPHY</span><h2>Start a conversation</h2><p>A clear space for your next idea.</p></div><div id="messages" aria-live="polite"></div><div class="composer-dock"><form class="composer"><textarea id="draft" aria-label="Message" rows="2" placeholder="Message MORPHY..."></textarea><div class="composer-tools"><button type="button" id="attach" aria-label="Add attachment"></button><button type="button" id="microphone" aria-label="Microphone"></button><span class="composer-shortcut">Shift + Enter for a new line</span><button id="send" type="submit" aria-label="Send message"></button></div></form><div class="composer-caption"><span>Personal workspace</span><span>Preview · Not connected</span></div></div></div></section></div>
<button id="preview-info" class="preview-info">Development preview</button><dialog id="handoff"><h2 id="handoff-title"></h2><p id="handoff-text"></p><button id="close-dialog">Close</button></dialog>
<script type="module" src="app.js"></script></body></html>
